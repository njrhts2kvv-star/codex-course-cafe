<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3D5A40">
  <title>首页 · 小林咖啡</title>
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    .home-hero { position: relative; min-height: 520px; overflow: hidden; border-radius: 5px; background: #3D5A40; color: #FAF7F2; display: flex; align-items: center; }
    .home-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 52%; }
    .home-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(39, 66, 43, .92), rgba(39, 66, 43, .55) 48%, rgba(39, 66, 43, .08)); }
    .home-hero h1 { position: relative; z-index: 1; margin: 0; padding: 72px; max-width: 700px; font-size: clamp(42px, 5.5vw, 72px); line-height: 1.3; letter-spacing: .04em; }
    .home-hero h1 span { display: inline-block; }
    .home-stores { padding-top: 56px; padding-bottom: 110px; }
    .home-store-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
    .home-store { border-top: 1px solid #c9d1c7; padding-top: 20px; }
    .home-store h2 { margin: 0 0 10px; font-size: 21px; }
    .home-store p { margin: 4px 0; font-size: 15px; line-height: 1.7; color: #657265; }
    .home-notice { margin: 28px 0 0; font-size: 13px; color: #657265; }
    @media (max-width: 700px) {
      .home-hero { min-height: 440px; align-items: flex-start; }
      .home-hero img { object-position: 57% center; }
      .home-hero::after { background: linear-gradient(180deg, rgba(39, 66, 43, .9), rgba(39, 66, 43, .2) 75%); }
      .home-hero h1 { padding: 48px 26px; font-size: clamp(38px, 10vw, 52px); }
      .home-stores { padding-top: 40px; padding-bottom: 72px; }
      .home-store-grid { grid-template-columns: 1fr; gap: 28px; }
    }
  </style>
</head>
<body>
  <header class="site-header wrap">
    <a class="brand" href="index.html">小林咖啡<span> · </span></a>
    <nav aria-label="主导航"><a href="index.html" aria-current="page">首页</a><a href="menu.html">菜单</a><a href="stores.html">门店</a></nav>
  </header>
  <main>
    <section class="wrap home-hero" aria-label="小林咖啡">
      <img src="图片/拿铁.png" alt="拿铁">
      <h1>小林咖啡 · 三家店，一样的好咖啡</h1>
    </section>
    <section class="wrap home-stores" aria-label="门店信息">
      <div class="home-store-grid">
        <article class="home-store"><h2>滨江店</h2><p>滨江路 18 号（示例地址）</p><p>每天 8:00–21:00</p></article>
        <article class="home-store"><h2>人民路店</h2><p>人民路 106 号（示例地址）</p><p>每天 7:30–20:00</p></article>
        <article class="home-store"><h2>大学城店</h2><p>大学城文汇街 3 号（示例地址）</p><p>每天 9:00–22:00</p></article>
      </div>
      <p class="home-notice">以上地址为课程演示用的虚构地址。</p>
    </section>
  </main>
</body>
</html>
